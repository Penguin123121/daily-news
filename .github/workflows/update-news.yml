name: 每日新闻更新

on:
  schedule:
    # 北京时间 8:00 = UTC 0:00
    - cron: '0 0 * * *'
    # 北京时间 20:00 = UTC 12:00
    - cron: '0 12 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'output/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 抓取新闻
        run: python fetch_news.py

      - name: 同步到 Pages 目录
        run: |
          rm -rf docs
          cp -r output docs

      - name: 保存并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ docs/
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "📰 自动更新新闻"
            git push
          fi
