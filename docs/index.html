    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
        background: #faf6ef;
        color: #333;
        line-height: 1.6;
    }
    /* 宣纸纹理背景 */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background:
            radial-gradient(ellipse at 20% 50%, rgba(200,160,120,0.06) 0%, transparent 50%),
            radial-gradient(ellipse at 80% 20%, rgba(180,140,100,0.04) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
    }
    .container { width: 95%; max-width: none; margin: 0 auto; padding: 20px 20px 40px; position: relative; z-index: 1; }

    /* ===== 匾额式 Header ===== */
    .header {
        text-align: center;
        padding: 32px 20px 24px;
        background: linear-gradient(175deg, #6b1000 0%, #8b0000 40%, #a01010 100%);
        color: #f5e6c8;
        border-radius: 10px;
        margin-bottom: 24px;
        box-shadow: 0 4px 24px rgba(107, 16, 0, 0.35);
        position: relative;
        border: 1px solid rgba(180, 130, 80, 0.3);
    }
    .header::before {
        content: '';
        position: absolute;
        top: 6px; left: 10px; right: 10px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(245,230,200,0.5), transparent);
    }
    .header::after {
        content: '';
        position: absolute;
        bottom: 6px; left: 10px; right: 10px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(245,230,200,0.3), transparent);
    }
    .header .brand-line {
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
        font-size: 10px;
        letter-spacing: 4px;
        opacity: 0.45;
        text-transform: uppercase;
        margin-bottom: 6px;
    }
    .header h1 {
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 8px;
        margin-bottom: 6px;
    }
    .header .divider {
        width: 48px;
        height: 1px;
        background: #d4a574;
        margin: 10px auto;
        opacity: 0.6;
    }
    .header .date-line {
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
        font-size: 11px;
        opacity: 0.5;
        letter-spacing: 2px;
    }
    .header .gen-time {
        font-size: 10px;
        opacity: 0.35;
        margin-top: 8px;
    }

    /* ===== 日期 Tab 栏 ===== */
    .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 24px;
    }
    .tab {
        flex: 1;
        text-align: center;
        padding: 12px 6px 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        color: #b8a088;
        background: #fdf8f3;
        border: 1px solid #e8d5c4;
        border-radius: 8px;
        outline: none;
        transition: all 0.25s;
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
    }
    .tab:hover {
        color: #8b4513;
        background: #fef5ec;
        border-color: #c0392b;
    }
    .tab.active {
        color: #f5e6c8;
        background: linear-gradient(175deg, #8b0000, #a01010);
        border-color: #6b1000;
        font-weight: 700;
        box-shadow: 0 2px 12px rgba(139, 0, 0, 0.25);
    }
    .tab .tab-weekday { font-size: 16px; }
    .tab .tab-date { font-size: 10px; display: block; margin-top: 3px; opacity: 0.7; }

    /* ===== 面板 ===== */
    .day-panel { display: none; }
    .day-panel.active {
        display: flex;
        gap: 20px;
        align-items: flex-start;
    }
    /* 时段分区列 */
    .period-col {
        flex: 1;
        min-width: 0;
    }
    .period-divider {
        width: 1px;
        background: linear-gradient(180deg, transparent, #d4b896 15%, #d4b896 85%, transparent);
        flex-shrink: 0;
        align-self: stretch;
    }

    /* ===== 时段板块标题 ===== */
    .period-section { margin-bottom: 24px; }

        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 0 12px 0;
        margin-bottom: 16px;
        border-bottom: 1px solid #e8d5c4;
    }
    .period-stamp {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 4px;
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
        font-size: 18px;
        font-weight: 700;
        color: #f5e6c8;
        flex-shrink: 0;
        letter-spacing: 2px;
        writing-mode: vertical-rl;

    .period-info { flex: 1; }

        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
        font-size: 18px;
        font-weight: 700;
        color: #4a3020;
    }
    .period-info .period-meta {
        font-size: 11px;
        color: #b8a088;
        margin-top: 2px;
    }

    /* ===== 新闻卡片 ===== */
    .news-item {
        display: flex;
        gap: 14px;
        background: #fff;
        border: 1px solid #e8d5c4;
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 12px;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .news-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(139, 69, 19, 0.1);
        border-color: #c0392b;
    }
    /* 序号印章 */
    .news-rank {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        color: #f5e6c8;
        font-size: 16px;
        font-weight: 700;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
    }
    .news-rank.morning { background: #c0392b; }
    .news-rank.evening { background: #2c3e50; }
    .news-rank.legacy { background: #8b0000; }
    .news-body { flex: 1; min-width: 0; }
    .news-title {
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 4px;
        line-height: 1.5;
    }
    .news-title a { color: #2a1a10; text-decoration: none; }
    .news-title a:hover { color: #c0392b; }
    .news-meta {
        font-size: 12px;
        color: #b8a088;
        margin-bottom: 8px;
    }
    .news-img { margin-bottom: 10px; }
    .news-img img {
        width: 100%;
        max-height: 280px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #f0e6d3;
    }
    .news-summary {
        font-size: 14px;
        color: #666;
        margin-bottom: 8px;
        text-align: justify;
        line-height: 1.7;
    }
    .news-link {
        display: inline-block;
        font-size: 13px;
        color: #c0392b;
        text-decoration: none;
        font-weight: 500;
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
    }
    .news-link:hover { text-decoration: underline; color: #8b0000; }

    /* ===== 占位 ===== */
    .period-placeholder {
        text-align: center;
        padding: 28px 20px;
        color: #c8b898;
        font-size: 14px;
        background: #fdf8f3;
        border: 1px dashed #e8d5c4;
        border-radius: 8px;
        margin-bottom: 12px;
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
    }
    .no-data {
        text-align: center;
        padding: 40px 20px;
        color: #c8b898;
        font-size: 14px;
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
    }
    .empty {
        text-align: center;
        padding: 50px 20px;
        color: #b8a088;
        font-size: 15px;
        font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", serif;
    }

    /* ===== Footer ===== */
    .footer {
        text-align: center;
        padding: 24px 20px;
        color: #c8b898;
        font-size: 12px;
        margin-top: 16px;
        border-top: 1px solid #e8d5c4;
    }
    .footer a { color: #8b4513; text-decoration: none; }
    .footer a:hover { color: #c0392b; }

    /* ===== 移动端 ===== */
    @media (max-width: 600px) {
        .container { padding: 12px 10px 30px; }
        .header { padding: 24px 14px 18px; }
        .header h1 { font-size: 22px; letter-spacing: 4px; }

        .day-panel.active {
            flex-direction: column;
            gap: 0;
        }
        .period-divider {
            display: none;
        }
        .news-item { padding: 14px; gap: 10px; }
        .news-title { font-size: 15px; }
        .news-summary { font-size: 13px; }
        .news-img img { max-height: 200px; }
        .period-stamp { width: 38px; height: 38px; font-size: 15px; }
    }
</style>

function buildPanel(d, active) {
    var cls = "day-panel" + (active ? " active" : "");
    var html = '<div class="' + cls + '" id="panel' + d.date + '">';

    if (d.morning || d.evening) {
        html += '<div class="period-col">' + buildPeriodSection(d.morning, "morning") + '</div>';
        html += '<div class="period-divider"></div>';
        html += '<div class="period-col">' + buildPeriodSection(d.evening, "evening") + '</div>';
    } else if (d.legacy && d.legacy.news && d.legacy.news.length > 0) {
        html += '<div class="period-col">' + buildPeriodSection(d.legacy, "legacy") + '</div>';
    } else {
        html += '<div class="no-data">该日暂无新闻数据</div>';
    }
    html += '</div>';
    return html;
}

function switchDay(index) {
    var tabs = document.querySelectorAll(".tab");
    var panels = document.querySelectorAll(".day-panel");
    tabs.forEach(function(t, i) { t.className = (i === index) ? "tab active" : "tab"; });
    panels.forEach(function(p, i) { p.className = (i === index) ? "day-panel active" : "day-panel"; });
}

function render() {
    var tabBar = document.getElementById("tabBar");
    var panelContainer = document.getElementById("panelContainer");
    if (daysData.length === 0) {
        tabBar.innerHTML = "";
        panelContainer.innerHTML = '<div class="empty">暂无新闻数据，请运行脚本获取</div>';
        return;
    }
    var tabHtml = "";
    var panelHtml = "";
    daysData.forEach(function(d, i) {
        tabHtml += buildTab(d, i, i === 0);
        panelHtml += buildPanel(d, i === 0);
    });
    tabBar.innerHTML = tabHtml;
    panelContainer.innerHTML = panelHtml;
}

render();
</script>
</body>
</html>
